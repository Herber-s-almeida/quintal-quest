<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0a14">
<title>Quintal Quest</title>
<style>
html,body{margin:0;height:100%;background:#0b0a14;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.28);color:rgba(255,255,255,.85);font:bold 14px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;backdrop-filter:blur(2px)}
.tb.on{background:rgba(255,220,120,.35);border-color:rgba(255,230,160,.85);color:#fff}
#stick{position:absolute;left:0;bottom:0;width:36%;height:55%;pointer-events:auto;touch-action:none}
#sbase{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.25);left:calc(env(safe-area-inset-left) + 48px);top:calc(100% - 48px);pointer-events:none}
#sknob{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);left:50%;top:50%;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#sbase.on{background:rgba(255,220,120,.14);border-color:rgba(255,230,160,.6)}
#bj{right:calc(env(safe-area-inset-right) + 12px);bottom:14px;width:62px;height:62px;font-size:13px}
#bp{right:calc(env(safe-area-inset-right) + 80px);bottom:18px;width:52px;height:52px;font-size:11px}
#bd{right:calc(env(safe-area-inset-right) + 36px);bottom:82px;width:48px;height:48px;font-size:11px}
#bpause{right:calc(env(safe-area-inset-right) + 10px);top:10px;width:34px;height:34px;font-size:12px;border-radius:8px;opacity:0.6}
#toolb{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 6px);transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.tbtn{padding:3px 9px;border-radius:8px;background:rgba(0,0,0,.5);border:1.5px solid rgba(255,255,255,.35);color:#fff;font:bold 11px system-ui,sans-serif;cursor:pointer;touch-action:none;user-select:none;opacity:0.6;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tbtn:hover,.tbtn:active{opacity:1}
#bgod.on{background:rgba(255,200,60,.7);border-color:#ffe45a;color:#1a1020}
#bfs.on{background:rgba(120,220,255,.6);border-color:#8ae0ff;color:#0a1c28}
#selp{position:fixed;inset:0;background:rgba(10,6,20,.88);display:none;z-index:20;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:30px;align-content:center}
#selp.on{display:flex}
#selp button{font:bold 15px system-ui,sans-serif;padding:12px 16px;border-radius:10px;border:2px solid #ffe45a;background:#2a1c40;color:#fff;min-width:150px}
#selp button.x{border-color:#888;background:#333}
#rot{position:fixed;inset:0;background:#141020;color:#ffe9a8;display:none;align-items:center;justify-content:center;text-align:center;font:bold 20px system-ui,sans-serif;padding:30px;z-index:9}
@media (orientation:portrait){
#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="360"></canvas></div>
<div id="touch">
  <div id="stick"><div id="sbase"><div id="sknob"></div></div></div>
  <div class="tb" id="bj" data-k="jump">PULO</div>
  <div class="tb" id="bp" data-k="punch">SOCO</div>
  <div class="tb" id="bd" data-k="dash">DASH</div>
  <div class="tb" id="bpause" data-k="pause">❚❚</div>
</div>
<div id="toolb">
  <div id="bfs" class="tbtn">⛶ CHEIA</div>
  <div id="bgod" class="tbtn">GOD</div>
  <div id="bsel" class="tbtn">FASES</div>
</div>
<div id="selp"></div>
<div id="rot">🐜<br><br>Gire o celular para jogar na horizontal</div>

const ASSETS = /*ASSETS*/;
</script>
<script>

</script>
</body>
</html>
